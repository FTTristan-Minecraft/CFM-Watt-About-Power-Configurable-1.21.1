name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Validates gradle/wrapper/gradle-wrapper.jar against the official Gradle checksums
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      # The remapped NeoForge jar is the only one meant for players,
      # the "-dev-shadow" and "-sources" jars are development artifacts.
      - name: Collect mod jar
        run: |
          mkdir -p dist
          cp neoforge/build/libs/cfm_wap-neoforge-*.jar dist/
          rm -f dist/*-dev-shadow.jar dist/*-sources.jar
          ls -l dist

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: cfm_wap-neoforge
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

  # Pushing a tag such as v1.2.1 publishes the built jar as a GitHub release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cfm_wap-neoforge
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
